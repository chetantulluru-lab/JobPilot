<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="50%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#E03E00" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFF2E6" />
      <stop offset="100%" stop-color="#FF6B00" />
    </radialGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer ambient glow ring -->
  <circle cx="32" cy="32" r="28" fill="url(#glowGrad)" opacity="0.15" />
  
  <!-- Main Orb Body -->
  <circle cx="32" cy="32" r="22" fill="url(#glowGrad)" filter="url(#softBlur)" />
  
  <!-- Bright Core -->
  <circle cx="30" cy="28" r="14" fill="url(#centerGlow)" opacity="0.95" />
  
  <!-- AI Sparkle / Star ✦ -->
  <path d="M32 16L34.5 27.5L46 30L34.5 32.5L32 44L29.5 32.5L18 30L29.5 27.5L32 16Z" fill="#FFFFFF" />
  <circle cx="43" cy="20" r="2.5" fill="#FFE2CC" />
  <circle cx="21" cy="42" r="2" fill="#FFE2CC" />
</svg>