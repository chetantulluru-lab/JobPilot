[build]
  publish = "dist"
  command = "npm run build"

[[headers]]
  for = "/downloads/JobPilot.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"JobPilot.apk\""
    Cache-Control = "public, max-age=31536000"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200